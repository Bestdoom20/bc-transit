name: selftest
on: [push, pull_request]
jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    container: python:${{ matrix.python }}   # official images: any Python version, git included
    steps:
      - uses: actions/checkout@v4
      - name: Offline selftests
        run: for s in transit gtfs flights drive; do python $s.py selftest; done
      - name: Lint (unused imports, undefined names)
        run: pip install -q pyflakes && python -m pyflakes transit.py gtfs.py flights.py drive.py
      - name: Installer into a temp folder
        run: sh install.sh /tmp/skills && test -f /tmp/skills/worldwide-transit/SKILL.md
